<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유리온 퀘스트 보상 보관함</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0E0E0E;
    --card: #181818;
    --card-hover: #202020;
    --line: #2A2A2A;
    --text: #F2F2F2;
    --muted: #9A9A9A;
    --yellow: #F4C70F;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', system-ui, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 56px 20px 64px; }

  .eyebrow {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--yellow);
    letter-spacing: 0.04em;
    display: flex; align-items: center; gap: 8px;
  }
  .eyebrow .dot { width: 6px; height: 6px; background: var(--yellow); border-radius: 1px; }
  h1 {
    margin-top: 14px;
    font-size: 28px;
    font-weight: 900;
    line-height: 1.32;
    letter-spacing: -0.02em;
  }
  h1 em { font-style: normal; color: var(--yellow); }
  .lead { word-break: keep-all; margin-top: 14px; font-size: 14.5px; color: var(--muted); }
  .lead b { color: var(--text); font-weight: 500; }

  .search {
    margin-top: 28px;
    width: 100%;
    padding: 15px 18px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    color: var(--text);
    font: inherit;
    font-size: 15px;
    outline: none;
    transition: border-color .15s;
  }
  .search::placeholder { color: #666; }
  .search:focus { border-color: var(--yellow); }

  .list { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
  .item {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 16px 12px 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    text-decoration: none;
    color: inherit;
    transition: background .15s, border-color .15s, transform .15s;
  }
  .item:hover { background: var(--card-hover); border-color: #3a3a3a; transform: translateY(-1px); }
  .item:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }

  .thumb {
    flex: none;
    width: 64px; height: 80px;
    border-radius: 10px;
    background: #000;
    border: 1px solid #262626;
    display: flex; flex-direction: column; justify-content: center;
    padding: 6px;
    overflow: hidden;
    position: relative;
  }
  .thumb .tag {
    position: absolute; top: 6px; left: 6px;
    font-family: 'Space Mono', monospace;
    font-size: 7px; color: #000; background: var(--yellow);
    padding: 1px 4px; border-radius: 3px;
  }
  .thumb .big {
    font-size: 13px; font-weight: 900; line-height: 1.15;
    color: #fff; letter-spacing: -0.03em; margin-top: 10px;
  }
  .thumb .big span { color: var(--yellow); }

  .meta { flex: 1; min-width: 0; }
  .meta .row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .badge {
    font-size: 11px; font-weight: 700;
    color: #000; background: var(--yellow);
    padding: 1px 7px; border-radius: 999px;
  }
  .date { font-size: 12px; color: #777; }
  .title { word-break: keep-all; font-size: 15.5px; font-weight: 700; line-height: 1.4; letter-spacing: -0.01em; }
  .arrow { flex: none; color: var(--yellow); font-size: 18px; font-weight: 700; }

  .empty { display: none; text-align: center; color: var(--muted); font-size: 14px; padding: 32px 0; }

  .foot {
    margin-top: 40px; padding-top: 24px;
    border-top: 1px dashed var(--line);
    text-align: center; font-size: 13px; color: #777;
  }
  .foot a { color: var(--yellow); text-decoration: none; font-weight: 500; }
</style>
</head>
<body>
<main class="wrap">
  <div class="eyebrow"><span class="dot"></span>YURION · 퀘스트 보상 보관함</div>
  <h1>퀘스트 완료! 🔥<br><em>보상</em>은 여기서 받아 가세요</h1>
  <p class="lead">댓글 달고 DM을 못 받으셨나요? 댓글이 많이 달리면 DM이 늦거나 빠질 수 있어요. 댓글 단 게시물의 자료를 찾아 눌러 주세요. <b>최신 보상이 맨 위에 있어요.</b></p>

  <input class="search" id="q" type="search" placeholder="받을 보상 검색 (예: 체크리스트, 이미지, 전략)" aria-label="자료 검색">

  <div class="list" id="list"></div>
  <p class="empty" id="empty">찾는 보상이 없어요. 다른 키워드로 검색해 보세요.</p>

  <div class="foot">
    새 퀘스트가 열릴 때마다 보상이 여기에 추가돼요<br>
    <a href="https://www.instagram.com/yurion_world/">@yurion_world 팔로우하고 다음 퀘스트 받기 →</a>
  </div>
</main>

<script>
  // 새 자료는 맨 위에 추가하세요. thumb: 썸네일에 들어갈 짧은 문구 (span은 노랑 강조)
  const resources = [
    {
      title: "팔리는 이미지 마케팅 전략 6가지",
      keyword: "마케팅",
      date: "2026.10.29",
      thumb: "팔리는<br><span>이미지</span><br>전략 6",
      url: "https://app.notion.com/p/6-408ce7373d9a8156b0ecff6443462387?source=copy_link"
    },
    {
      title: "콘텐츠 업로드 전 15가지 체크리스트",
      keyword: "유리온",
      date: "2026.10.23",
      thumb: "업로드<br><span>체크</span><br>15가지",
      url: "https://app.notion.com/p/15-402ce7373d9a8119abc5f2054e91c175?source=copy_link"
    }
  ];

  const list = document.getElementById('list');
  const empty = document.getElementById('empty');

  function render(q) {
    const term = q.trim().toLowerCase();
    const items = resources.filter(r =>
      !term || (r.title + ' ' + r.keyword).toLowerCase().includes(term)
    );
    list.innerHTML = items.map((r, i) => `
      <a class="item" href="${r.url}" target="_blank" rel="noopener">
        <div class="thumb"><span class="tag">REWARD</span><div class="big">${r.thumb}</div></div>
        <div class="meta">
          ${i === 0 && !term ? '<div class="row"><span class="badge">NEW</span></div>' : ''}
          <div class="title">${r.title}</div>
        </div>
        <span class="arrow">→</span>
      </a>`).join('');
    empty.style.display = items.length ? 'none' : 'block';
  }

  document.getElementById('q').addEventListener('input', e => render(e.target.value));
  render('');
</script>
</body>
</html>
